[workspace]
members = [
  "agent/core",
  "crates/domain",
  "crates/provider-contracts",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.82"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
