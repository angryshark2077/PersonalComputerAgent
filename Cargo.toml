[workspace]
members = [
  "agent/core",
  "crates/agent-runtime",
  "crates/db-local",
  "crates/domain",
  "crates/provider-contracts",
  "crates/test-contracts",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
