name: S0 and S1A Engineering Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format-lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: pnpm typecheck

  build-unit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: swift build --package-path platform/macos
      - name: Swift package tests except process-signal cases
        run: >-
          swift test --package-path platform/macos
          --skip 'HandshakeTests.test(PostStartSignalsCleanlyStopRealServerProcess|ProcessLevelStartupSignalsExitZeroWithoutSocketArtifacts|SignalDuringDelayedStartIsConsumedAfterRealServerStarts)'
      - name: Swift post-start signal test in an isolated runner
        run: swift test --package-path platform/macos --filter HandshakeTests.testPostStartSignalsCleanlyStopRealServerProcess
      - name: Swift startup signal test in an isolated runner
        run: swift test --package-path platform/macos --filter HandshakeTests.testProcessLevelStartupSignalsExitZeroWithoutSocketArtifacts
      - name: Swift delayed-start signal test in an isolated runner
        run: swift test --package-path platform/macos --filter HandshakeTests.testSignalDuringDelayedStartIsConsumedAfterRealServerStarts
      - run: swift run --package-path platform/macos BridgeContractVerifier

  s1a-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - name: Swift package tests except process-signal cases
        run: >-
          swift test --package-path platform/macos
          --skip 'HandshakeTests.test(PostStartSignalsCleanlyStopRealServerProcess|ProcessLevelStartupSignalsExitZeroWithoutSocketArtifacts|SignalDuringDelayedStartIsConsumedAfterRealServerStarts)'
      - name: Swift post-start signal test in an isolated runner
        run: swift test --package-path platform/macos --filter HandshakeTests.testPostStartSignalsCleanlyStopRealServerProcess
      - name: Swift startup signal test in an isolated runner
        run: swift test --package-path platform/macos --filter HandshakeTests.testProcessLevelStartupSignalsExitZeroWithoutSocketArtifacts
      - name: Swift delayed-start signal test in an isolated runner
        run: swift test --package-path platform/macos --filter HandshakeTests.testSignalDuringDelayedStartIsConsumedAfterRealServerStarts
      - run: swift run --package-path platform/macos BridgeContractVerifier
      - run: >-
          xcodebuild test
          -project platform/macos/PersonalComputerAgent.xcodeproj
          -scheme PersonalComputerAgent
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
      - run: python3 scripts/verify_migrations.py .
      - run: python3 scripts/verify_boundaries.py .
      - run: python3 -m unittest scripts.tests.test_s1a_packaging scripts.tests.test_s1a_live_verification scripts.tests.test_run_with_timeout -v

  contract:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  migration:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_migrations.py .

  boundary:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_boundaries.py .
