[package]
name = "pca-agentd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
process-test-hooks = ["pca-db-local/process-test-hooks"]

[[bin]]
name = "pca-test-bridge"
path = "tests/support/fake_bridge.rs"
required-features = ["process-test-hooks"]

[[bin]]
name = "pca-s1b-acceptance-agent"
path = "tests/support/s1b_acceptance_agent.rs"
required-features = ["process-test-hooks"]

[[test]]
name = "process_lifecycle"
required-features = ["process-test-hooks"]

[[test]]
name = "system_collector_process"
required-features = ["process-test-hooks"]

[[test]]
name = "collector_commit_kill"
required-features = ["process-test-hooks"]

[[test]]
name = "event_outbox_kill"
required-features = ["process-test-hooks"]

[dependencies]
base64 = "=0.22.1"
pca-agent-runtime = { path = "../../crates/agent-runtime" }
pca-bridge-client = { path = "../../crates/bridge-client" }
pca-db-local = { path = "../../crates/db-local" }
pca-domain = { path = "../../crates/domain" }
pca-keychain = { path = "../../crates/keychain" }
pca-provider-contracts = { path = "../../crates/provider-contracts" }
pca-system-collector = { path = "../../crates/system-collector" }
pca-wechat-provider = { path = "../../crates/wechat-provider" }
reqwest = { version = "=0.11.27", default-features = false, features = ["__internal_proxy_sys_no_cache", "json", "rustls-tls"] }
rustix = { version = "=0.38.44", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
time = { version = "=0.3.36", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
