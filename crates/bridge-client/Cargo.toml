[package]
name = "pca-bridge-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
hmac = "0.12"
pca-domain = { path = "../domain" }
pca-keychain = { path = "../keychain" }
rand = "0.8"
serde.workspace = true
