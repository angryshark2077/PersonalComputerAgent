[package]
name = "pca-wechat-provider"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pca-domain = { path = "../domain" }
pca-keychain = { path = "../keychain" }
pca-provider-contracts = { path = "../provider-contracts" }
rusqlite = { version = "=0.32.1", features = ["bundled-sqlcipher-vendored-openssl", "hooks"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
rustix = { version = "=0.38.44", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
